name: Build unsigned IPA

on:
  push:
    branches:
      - wordandpiski-build
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -project WordAndPiski.xcodeproj \
            -scheme WordAndPiski \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/WordAndPiski.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            archive

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/WordAndPiski.xcarchive/Products/Applications/WordAndPiski.app" Payload/
          zip -qry WordAndPiski.ipa Payload
          ls -lh WordAndPiski.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WordAndPiski-unsigned-ipa
          path: WordAndPiski.ipa
          retention-days: 14
